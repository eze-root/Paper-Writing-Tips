name: Build and deploy documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation and slides
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            dockers/requirements.txt
            dockers/requirements-dev.txt

      - name: Set up Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.15.1"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dockers/requirements.txt "touying==0.14.4"

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes latexmk texlive-xetex texlive-lang-chinese fonts-noto-cjk

      - name: Build slides
        run: ./typsts/build.sh

      - name: Build HTML documentation
        run: sphinx-build --builder html --fail-on-warning source build

      - name: Build printable checklist
        run: |
          sphinx-build --builder latex source "${{ runner.temp }}/paper-writing-tips-latex"
          make -C "${{ runner.temp }}/paper-writing-tips-latex" all-pdf
          cp "${{ runner.temp }}/paper-writing-tips-latex"/*.pdf build/_static/

      - name: Verify published files
        run: |
          test -s build/index.html
          test -s build/mds/slides.html
          test -s build/slides/index.html
          test -s build/slides/paper-writing-tips.pdf
          test -s build/slides/paper-writing-tips.pptx
          touch build/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
